<h1>Introdução de Links</h1>
<p>Links são uma parte fundamental da web, <br>
    permitindo que os usuários naveguem entre diferentes páginas e sites.<br>
    Eles podem ser usados para conectar informações relacionadas, <br>
    direcionar os usuários para recursos adicionais ou simplesmente facilitar a navegação.</p>
    <br>
<a href="https://www.google.com">Google</a> <!-- exemplo de vinculo de link -->

<!-- href especifica o destino do link, que pode ser uma URL externa ou uma âncora interna. -->
<!-- o uso de "" é opcional, mas é uma boa prática para garantir a compatibilidade com todos os navegadores. -->
