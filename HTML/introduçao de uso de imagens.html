<h2>O uso de imagens </h2>

<!-- as imagens são vinculadas apartir do atibuto <img> -->
<!-- <p>As imagens são uma parte importante do design da web, <br> -->

<em>imagens</em> 
<br>
<img> <!-- exemplo de vinculo de imagem -->


<img src=" https://i.pinimg.com/736x/ca/e1/b4/cae1b4f6b223fe5a7bb712b680cffa67.jpg ">

<!-- o src especifica o caminho da imagem, que pode ser uma URL externa ou um caminho relativo. -->
<br>
<img src="https://mimo.app/i/earth.png">

<!--Podemos usar atributos para alterar o tamanho das imagens. O width e height os atributos usam pixels como a unidade de medida padrão.-->
<img src="https://mimo.app/i/earth.png" width="100" height="200">
<!--E o height atributo ajusta o altura de uma imagem.-->
<img src="https://mimo.app/i/earth.png" width="100" height="50">

<img src="https://mimo.app/i/dog.png">
<img src="https://mimo.app/i/cat.png">
