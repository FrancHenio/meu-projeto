<!doctype html>
<html>
 <head>
<link rel="stylesheet" href="style.css"><!-- usado para linkar o arquivo do css "style.css" no nosso arquivo de criaçao de html-->
<!-- Para saber que tipo de arquivo incluir, a abertura link tag precisa do rel conjunto de atributos usando rel="stylesheet". -->
 <!--Para especificar a localização da folha de estilo, defina o href atribuir a "style.css".-->
 </head>
 <body>
  <h1>titulo</h1>
  <p class="gray-element"> paragrafo </p> <!--"class" cria uma classe para ser usada no style.css-->
 </body>
</html>
