

<!doctype html><!--<!DOCTYPE html> é uma declaração que informa ao navegador que o documento HTML está usando a versão mais recente do HTML.-->
<html><!-- O head Elemento HTML,<head></head>é um contêiner para informações sobre uma página da Web, como seu título. Vai antes da etiqueta do corpo.-->
 <head><!--o uso de head acontece apos a distisao de arquivo "html" pois ele faz parte de titulos e nao do corpo "body"-->
  <title>Meu primeiro site</title><!--O título de uma página da web aparece na guia ou janela do navegador da web.-->
 </head>
 <body>
  <h1>My favorite things</h1>
  <p> Raindrops on <em>roses</em><br> Whiskers on
   <strong>kittens</strong>  </p>  
 </body>
</html>
